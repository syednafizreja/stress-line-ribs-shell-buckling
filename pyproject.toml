[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ribshell"
version = "0.1.0"
description = "Stress-line ribs vs optimised thickness: lateral-load buckling of a form-found concrete shell at equal embodied carbon"
authors = [{ name = "Syed Nafiz Reja Hasib" }]
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]
