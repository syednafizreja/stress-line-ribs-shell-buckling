# Conda environment for this study. Create it with: conda env create -f environment.yml
# Versions recorded 17 Nov 2026.
name: research
dependencies:
  - python=3.12
  - numpy==2.5.4
  - scipy==1.18.1
  - matplotlib==3.11.2
  - calculix=2.23      # ccx; needs Library/mingw-w64/bin on PATH -> cecore.env.setup_ccx() does this
  - pip:
      - gmsh==4.15.2
      - meshio
      - cma==4.6.0
      - pyvista==0.49.2
      - ifcopenshell==0.9.0.post1
      - ezdxf==1.4.5
      - imageio==2.38.2
      - git+https://github.com/syednafizreja/ShellBench@v1.0.0   # form finding (DOI release; src identical to main)
      - -e .            # ribshell + vendored cecore (ccx helper, stress-line tracer)
